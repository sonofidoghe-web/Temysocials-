<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deposits - Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8f9fa;
      color: #111;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .header {
      position: sticky; top: 0; z-index: 100;
      background: #fff; padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #eee;
    }
    .menu-toggle { background: none; border: none; cursor: pointer; padding: 4px; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .admin-badge {
      background: #3d6b1e; color: white; font-size: 12px;
      padding: 4px 10px; border-radius: 20px; font-weight: 500;
    }
    .avatar {
      width: 36px; height: 36px; background: #3d6b1e; color: white;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 14px;
    }

    .sidebar-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200;
      opacity: 0; visibility: hidden; transition: all 0.3s ease;
    }
    .sidebar-overlay.active { opacity: 1; visibility: visible; }
    .sidebar {
      position: fixed; top: 0; left: 0; width: 300px; height: 100%;
      background: white; z-index: 300; transform: translateX(-100%);
      transition: transform 0.3s ease; overflow-y: auto; padding: 20px 0 30px;
    }
    .sidebar.active { transform: translateX(0); }
    .sidebar-logo { padding: 0 20px 20px; border-bottom: 1px solid #eee; }
    .sidebar-logo img { height: 40px; }
    .menu-section { padding: 20px 12px 8px; }
    .menu-section-title {
      font-size: 13px; color: #888; font-weight: 500; padding: 0 12px 10px;
      text-transform: uppercase;
    }
    .menu-item {
      display: flex; align-items: center; gap: 14px; padding: 12px 14px;
      border-radius: 12px; color: #333; text-decoration: none; font-size: 15px;
      font-weight: 500; margin-bottom: 2px;
    }
    .menu-item:hover { background: #f5f5f5; }
    .menu-item.active { background: #f0f7eb; color: #3d6b1e; }
    .signout-item { color: #d32f2f !important; }

    .container { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }

    .deposit-card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid #f0f0f0;
    }
    .deposit-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .deposit-amount {
      font-size: 18px;
      font-weight: 700;
      color: #3d6b1e;
    }
    .deposit-status {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 500;
    }
    .status-pending { background: #fff3e0; color: #ef6c00; }
    .status-success { background: #e6f4ea; color: #137333; }
    .status-failed { background: #fce8e6; color: #c5221f; }

    .deposit-info {
      font-size: 13px;
      color: #555;
      margin-bottom: 4px;
    }
    .deposit-ref {
      font-size: 12px;
      color: #888;
      margin-bottom: 12px;
      word-break: break-all;
    }

    .approve-btn {
      width: 100%;
      padding: 11px;
      background: #3d6b1e;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .approve-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="logo.png" alt="Temmy Social">
    </div>
    <div class="menu-section">
      <div class="menu-section-title">Admin</div>
      <a href="admin.html" class="menu-item">Dashboard</a>
      <a href="admin-users.html" class="menu-item">Users</a>
      <a href="admin-deposits.html" class="menu-item active">Deposits</a>
      <a href="admin-products.html" class="menu-item">Products</a>
      <a href="admin-orders.html" class="menu-item">Orders</a>
    </div>
    <div class="menu-section">
      <div class="menu-section-title">Main Site</div>
      <a href="dashboard.html" class="menu-item">User Dashboard</a>
    </div>
    <div class="menu-section" style="border-top:1px solid #eee; margin-top:10px; padding-top:10px;">
      <a href="#" class="menu-item signout-item" id="signOutBtn">Sign out</a>
    </div>
  </div>

  <header class="header">
    <button class="menu-toggle" id="menuToggle">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
      </svg>
    </button>
    <div class="header-right">
      <span class="admin-badge">Admin</span>
      <div class="avatar">AD</div>
    </div>
  </header>

  <div class="container">
    <h1>Deposits</h1>
    <p class="subtitle">Approve pending top-ups</p>

    <div id="depositsList">
      <div class="empty-state">Loading deposits...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { 
      getFirestore, collection, query, where, orderBy, getDocs, 
      doc, updateDoc, increment, getDoc 
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDDutrOemL5dqk4hIdQ1K2QmhiBhtegv8k",
      authDomain: "trustsocials-8fc8b.firebaseapp.com",
      projectId: "trustsocials-8fc8b",
      storageBucket: "trustsocials-8fc8b.firebasestorage.app",
      messagingSenderId: "675550258010",
      appId: "1:675550258010:web:ec6444eb22b04a92fd0963",
      measurementId: "G-KDVYRV55JD"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ADMIN_EMAIL = "danielidoghe@gmail.com";

    // Sidebar
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    document.getElementById('menuToggle').addEventListener('click', () => {
      sidebar.classList.add('active');
      overlay.classList.add('active');
    });
    overlay.addEventListener('click', () => {
      sidebar.classList.remove('active');
      overlay.classList.remove('active');
    });

    document.getElementById('signOutBtn').addEventListener('click', async (e) => {
      e.preventDefault();
      await signOut(auth);
      window.location.href = 'login.html';
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      if (user.email !== ADMIN_EMAIL) {
        alert('Access denied');
        window.location.href = 'dashboard.html';
        return;
      }

      loadDeposits();
    });

    async function loadDeposits() {
      const list = document.getElementById('depositsList');

      try {
        // Get pending top-ups first
        const q = query(
          collection(db, 'transactions'),
          where('type', '==', 'topup'),
          orderBy('createdAt', 'desc')
        );

        const snapshot = await getDocs(q);

        if (snapshot.empty) {
          list.innerHTML = `<div class="empty-state">No deposits found</div>`;
          return;
        }

        let html = '';
        for (const docSnap of snapshot.docs) {
          const tx = docSnap.data();
          const dateStr = tx.createdAt?.toDate 
            ? tx.createdAt.toDate().toLocaleString('en-GB', {
                day: 'numeric', month: 'short', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
              })
            : '';

          // Get user email
          let userEmail = tx.userId;
          try {
            const userDoc = await getDoc(doc(db, 'users', tx.userId));
            if (userDoc.exists()) {
              userEmail = userDoc.data().email || tx.userId;
            }
          } catch (e) {}

          const isPending = tx.status === 'pending';

          html += `
            <div class="deposit-card">
              <div class="deposit-header">
                <div class="deposit-amount">₦${Number(tx.amount || 0).toLocaleString()}</div>
                <span class="deposit-status status-${tx.status}">${tx.status}</span>
              </div>
              <div class="deposit-info">${userEmail}</div>
              <div class="deposit-ref">Ref: ${tx.reference || '-'} • ${dateStr}</div>
              
              ${isPending ? `
                <button class="approve-btn" onclick="approveDeposit('${docSnap.id}', '${tx.userId}', ${tx.amount})">
                  Approve Deposit
                </button>
              ` : ''}
            </div>
          `;
        }

        list.innerHTML = html;

      } catch (err) {
        console.error(err);
        list.innerHTML = `<div class="empty-state">Failed to load deposits</div>`;
      }
    }

    // Approve Deposit
    window.approveDeposit = async function(txId, userId, amount) {
      if (!confirm(`Approve ₦${Number(amount).toLocaleString()} deposit?`)) return;

      try {
        // 1. Update transaction status
        await updateDoc(doc(db, 'transactions', txId), {
          status: 'success'
        });

        // 2. Add balance to user
        await updateDoc(doc(db, 'users', userId), {
          balance: increment(Number(amount))
        });

        alert('Deposit approved successfully!');
        loadDeposits();

      } catch (err) {
        console.error(err);
        alert('Failed to approve deposit');
      }
    };
  </script>
</body>
</html>
