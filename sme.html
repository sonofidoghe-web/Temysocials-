<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SME Boosting - Trust Social</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8f9fa;
      color: #111;
      min-height: 100vh;
      padding-bottom: 50px;
    }

    /* Header */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: #fff; padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #eee; transition: all 0.3s ease;
    }
    .header.scrolled {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
    }
    .menu-toggle { background: none; border: none; cursor: pointer; padding: 4px; color: #333; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .badge-no { background: #f0f0f0; color: #555; font-size: 13px; font-weight: 500; padding: 4px 10px; border-radius: 20px; }
    .icon-btn { background: none; border: none; cursor: pointer; padding: 4px; color: #444; }
    .avatar {
      width: 36px; height: 36px; background: #3d6b1e; color: white;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 14px;
    }

    /* Sidebar */
    .sidebar-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200;
      opacity: 0; visibility: hidden; transition: all 0.3s ease;
    }
    .sidebar-overlay.active { opacity: 1; visibility: visible; }
    .sidebar {
      position: fixed; top: 0; left: 0; width: 300px; height: 100%;
      background: white; z-index: 300; transform: translateX(-100%);
      transition: transform 0.3s ease; overflow-y: auto; padding: 20px 0 30px;
    }
    .sidebar.active { transform: translateX(0); }
    .sidebar-logo { padding: 0 20px 20px; border-bottom: 1px solid #eee; }
    .sidebar-logo img { height: 40px; }
    .menu-section { padding: 20px 12px 8px; }
    .menu-section-title {
      font-size: 13px; color: #888; font-weight: 500; padding: 0 12px 10px;
      text-transform: uppercase; letter-spacing: 0.3px;
    }
    .menu-item {
      display: flex; align-items: center; gap: 14px; padding: 12px 14px;
      border-radius: 12px; color: #333; text-decoration: none; font-size: 15px;
      font-weight: 500; margin-bottom: 2px;
    }
    .menu-item:hover { background: #f5f5f5; }
    .menu-item.active { background: #f0f7eb; color: #3d6b1e; }
    .menu-item svg { width: 20px; height: 20px; flex-shrink: 0; }
    .signout-item { color: #d32f2f !important; }

    /* Content */
    .container { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
    .subtitle { color: #666; font-size: 15px; margin-bottom: 28px; }

    .section-title {
      font-size: 16px; font-weight: 600; margin-bottom: 14px;
    }

    /* Platforms */
    .platforms-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 28px;
    }
    .platform-card {
      background: white;
      border: 1.5px solid #e8e8e8;
      border-radius: 14px;
      padding: 16px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .platform-card:hover { border-color: #3d6b1e; }
    .platform-card.active {
      border-color: #3d6b1e;
      background: #f0f7eb;
    }
    .platform-icon { font-size: 26px; margin-bottom: 6px; }
    .platform-name { font-size: 13px; font-weight: 500; }

    /* Services */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 30px;
    }
    .service-card {
      background: white;
      border: 1.5px solid #e8e8e8;
      border-radius: 14px;
      padding: 16px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .service-card:hover { border-color: #3d6b1e; }
    .service-card.active {
      border-color: #3d6b1e;
      background: #f0f7eb;
    }
    .service-name { font-size: 14px; font-weight: 500; }

    .buy-btn {
      width: 100%;
      padding: 16px;
      background: #3d6b1e;
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .buy-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    /* CHAT */
    .chat-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000;
      display: flex; align-items: flex-end; justify-content: center;
      opacity: 0; visibility: hidden; transition: all 0.3s ease;
    }
    .chat-overlay.active { opacity: 1; visibility: visible; }

    .chat-box {
      background: white;
      width: 100%;
      max-width: 420px;
      height: 75vh;
      max-height: 580px;
      border-radius: 20px 20px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(100%);
      transition: transform 0.35s ease;
    }
    .chat-overlay.active .chat-box { transform: translateY(0); }

    .chat-header {
      padding: 16px 20px;
      background: #3d6b1e;
      color: white;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-header .avatar-small {
      width: 38px; height: 38px; background: white; color: #3d6b1e;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px;
    }
    .chat-header-info h3 { font-size: 16px; font-weight: 600; }
    .chat-header-info p { font-size: 12px; opacity: 0.85; }

    .chat-messages {
      flex: 1;
      padding: 20px 16px;
      overflow-y: auto;
      background: #f7f7f7;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      animation: fadeIn 0.3s ease;
    }
    .message.bot {
      background: white;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    .message.user {
      background: #3d6b1e;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .chat-input-area {
      padding: 12px 16px;
      background: white;
      border-top: 1px solid #eee;
      display: flex;
      gap: 10px;
    }
    .chat-input-area input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 25px;
      font-size: 15px;
      outline: none;
    }
    .chat-input-area button {
      background: #3d6b1e;
      color: white;
      border: none;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
    }

    .typing {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      background: white;
      border-radius: 18px;
      align-self: flex-start;
      width: fit-content;
    }
    .typing span {
      width: 7px; height: 7px; background: #999; border-radius: 50%;
      animation: typing 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- SIDEBAR OVERLAY -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="logo.png" alt="Temmy Social">
    </div>

    <div class="menu-section">
      <div class="menu-section-title">Main</div>
      <a href="dashboard.html" class="menu-item">Dashboard</a>
      <a href="wallet.html" class="menu-item">Wallet</a>
      <a href="orders.html" class="menu-item">Orders</a>
      <a href="transactions.html" class="menu-item">Transactions</a>
    </div>

    <div class="menu-section">
      <div class="menu-section-title">Store</div>
      <a href="logs.html" class="menu-item">Logs Store</a>
      <a href="tools.html" class="menu-item">Tools Store</a>
      <a href="sms.html" class="menu-item">SMS Numbers</a>
      <a href="sme.html" class="menu-item active">SME Boosting</a>
    </div>

    <div class="menu-section">
      <div class="menu-section-title">Account</div>
      <a href="support.html" class="menu-item">Support</a>
      <a href="notification.html" class="menu-item">Notification</a>
      <a href="profile.html" class="menu-item">Profile</a>
    </div>

    <div class="menu-section" style="border-top:1px solid #eee; margin-top:10px; padding-top:10px;">
      <a href="login.html" class="menu-item signout-item" id="signOutBtn">Sign out</a>
    </div>
  </div>

  <!-- HEADER -->
  <header class="header" id="header">
    <button class="menu-toggle" id="menuToggle">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
      </svg>
    </button>
    <div class="header-right">
      <span class="badge-no">No</span>
      <button class="icon-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
      </button>
      <button class="icon-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
      </button>
      <div class="avatar" id="userAvatar">--</div>
    </div>
  </header>

  <div class="container">
    <h1>SME Boosting</h1>
    <p class="subtitle">Boost your social media presence</p>

    <div class="section-title">1. Choose Platform</div>
    <div class="platforms-grid" id="platformsGrid"></div>

    <div class="section-title">2. Choose Service</div>
    <div class="services-grid" id="servicesGrid"></div>

    <button class="buy-btn" id="buyBtn" disabled>Select Platform & Service first</button>
  </div>

  <!-- CHAT POPUP -->
  <div class="chat-overlay" id="chatOverlay">
    <div class="chat-box">
      <div class="chat-header">
        <div class="avatar-small">TS</div>
        <div class="chat-header-info">
          <h3>Temmy Socials</h3>
          <p>Online</p>
        </div>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Type here..." autocomplete="off">
        <button id="sendBtn">➤</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDDutrOemL5dqk4hIdQ1K2QmhiBhtegv8k",
      authDomain: "trustsocials-8fc8b.firebaseapp.com",
      projectId: "trustsocials-8fc8b",
      storageBucket: "trustsocials-8fc8b.firebasestorage.app",
      messagingSenderId: "675550258010",
      appId: "1:675550258010:web:ec6444eb22b04a92fd0963",
      measurementId: "G-KDVYRV55JD"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);

    // ========== CONFIG ==========
    const API_URL = "https://pdsboost-proxy.netlify.app/.netlify/functions/api";

    // You will later map real Service IDs from PdsBoost here
    // For now we use placeholder IDs (you must change them later)
    const serviceMap = {
      "Instagram_Followers": 1,
      "Instagram_Likes": 2,
      "TikTok_Followers": 3,
      "TikTok_Likes": 4,
      "YouTube_Views": 5,
      "Facebook_Likes": 6
      // Add more after you get the real list
    };

    const platforms = [
      { name: "Instagram", icon: "📸" },
      { name: "Facebook", icon: "👤" },
      { name: "TikTok", icon: "🎵" },
      { name: "YouTube", icon: "▶️" },
      { name: "Twitter/X", icon: "🐦" },
      { name: "Telegram", icon: "✈️" }
    ];

    const services = [
      { name: "Followers" },
      { name: "Likes" },
      { name: "Views" },
      { name: "Comments" },
      { name: "Shares" },
      { name: "Saves" }
    ];

    let selectedPlatform = null;
    let selectedService = null;
    let chatStep = 0; // 0 = waiting link, 1 = waiting quantity
    let userLink = "";
    let userQuantity = "";

    // ========== SIDEBAR ==========
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');

    document.getElementById('menuToggle').addEventListener('click', () => {
      sidebar.classList.add('active');
      overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    });
    overlay.addEventListener('click', () => {
      sidebar.classList.remove('active');
      overlay.classList.remove('active');
      document.body.style.overflow = '';
    });

    window.addEventListener('scroll', () => {
      document.getElementById('header').classList.toggle('scrolled', window.scrollY > 10);
    });

    document.getElementById('signOutBtn').addEventListener('click', async (e) => {
      e.preventDefault();
      await signOut(auth);
      window.location.href = 'login.html';
    });

    // ========== RENDER PLATFORMS & SERVICES ==========
    const platformsGrid = document.getElementById('platformsGrid');
    platforms.forEach(platform => {
      const card = document.createElement('div');
      card.className = 'platform-card';
      card.innerHTML = `
        <div class="platform-icon">${platform.icon}</div>
        <div class="platform-name">${platform.name}</div>
      `;
      card.addEventListener('click', () => {
        document.querySelectorAll('.platform-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        selectedPlatform = platform.name;
        updateBuyButton();
      });
      platformsGrid.appendChild(card);
    });

    const servicesGrid = document.getElementById('servicesGrid');
    services.forEach(service => {
      const card = document.createElement('div');
      card.className = 'service-card';
      card.innerHTML = `<div class="service-name">${service.name}</div>`;
      card.addEventListener('click', () => {
        document.querySelectorAll('.service-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        selectedService = service.name;
        updateBuyButton();
      });
      servicesGrid.appendChild(card);
    });

    const buyBtn = document.getElementById('buyBtn');
    function updateBuyButton() {
      if (selectedPlatform && selectedService) {
        buyBtn.disabled = false;
        buyBtn.textContent = `Buy ${selectedService} for ${selectedPlatform}`;
      } else {
        buyBtn.disabled = true;
        buyBtn.textContent = 'Select Platform & Service first';
      }
    }

    // ========== CHAT SYSTEM ==========
    const chatOverlay = document.getElementById('chatOverlay');
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');

    buyBtn.addEventListener('click', () => {
      if (!selectedPlatform || !selectedService) return;
      startChat();
    });

    function startChat() {
      chatMessages.innerHTML = '';
      chatStep = 0;
      userLink = '';
      userQuantity = '';
      chatOverlay.classList.add('active');

      setTimeout(() => {
        addBotMessage(`You selected <b>${selectedService}</b> for <b>${selectedPlatform}</b>.`);
        setTimeout(() => {
          addBotMessage("Please send the <b>Link</b> of the account/post:");
        }, 800);
      }, 400);
    }

    function addBotMessage(text) {
      const msg = document.createElement('div');
      msg.className = 'message bot';
      msg.innerHTML = text;
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function addUserMessage(text) {
      const msg = document.createElement('div');
      msg.className = 'message user';
      msg.textContent = text;
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showTyping() {
      const typing = document.createElement('div');
      typing.className = 'typing';
      typing.id = 'typingIndicator';
      typing.innerHTML = '<span></span><span></span><span></span>';
      chatMessages.appendChild(typing);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById('typingIndicator');
      if (t) t.remove();
    }

    sendBtn.addEventListener('click', handleUserInput);
    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleUserInput();
    });

    function handleUserInput() {
      const text = chatInput.value.trim();
      if (!text) return;

      addUserMessage(text);
      chatInput.value = '';

      if (chatStep === 0) {
        // User sent the link
        userLink = text;
        chatStep = 1;
        showTyping();
        setTimeout(() => {
          removeTyping();
          addBotMessage("Great! Now send the <b>Quantity</b> you want:");
        }, 900);
      } 
      else if (chatStep === 1) {
        // User sent quantity
        userQuantity = text;
        chatStep = 2;
        placeRealOrder();
      }
    }

    async function placeRealOrder() {
      showTyping();
      addBotMessage("Placing your order, please wait...");

      // Temporary: You must replace these with real Service IDs from PdsBoost
      const key = `${selectedPlatform}_${selectedService}`;
      const serviceId = serviceMap[key] || 1; // fallback

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "add",
            service: serviceId,
            link: userLink,
            quantity: userQuantity
          })
        });

        const data = await response.json();
        removeTyping();

        if (data.order) {
          addBotMessage(`✅ Order placed successfully!<br><br>
            <b>Order ID:</b> ${data.order}<br>
            Platform: ${selectedPlatform}<br>
            Service: ${selectedService}<br>
            Quantity: ${userQuantity}`);
        } else {
          addBotMessage(`❌ Error: ${data.error || JSON.stringify(data)}`);
        }
      } catch (err) {
        removeTyping();
        addBotMessage("❌ Failed to place order. Please try again later.");
      }
    }

    // ========== AUTH ==========
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      const displayName = user.displayName || user.email.split('@')[0];
      const names = displayName.trim().split(' ');
      let initials = names[0].charAt(0).toUpperCase();
      if (names.length > 1) initials += names[names.length - 1].charAt(0).toUpperCase();
      document.getElementById('userAvatar').textContent = initials;
    });
  </script>
</body>
</html>
