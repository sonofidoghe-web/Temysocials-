<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8f9fa;
      color: #111;
      min-height: 100vh;
      padding-bottom: 50px;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #fff;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      transition: all 0.3s ease;
    }

    .header.scrolled {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
    }

    .menu-toggle,
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #333;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge-no {
      background: #f0f0f0;
      color: #555;
      font-size: 13px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      background: #3d6b1e;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
    }

    /* SIDEBAR */

    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .sidebar-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 300px;
      height: 100%;
      background: white;
      z-index: 300;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      overflow-y: auto;
      padding: 20px 0 30px;
    }

    .sidebar.active {
      transform: translateX(0);
    }

    .sidebar-logo {
      padding: 0 20px 20px;
      border-bottom: 1px solid #eee;
    }

    .sidebar-logo img {
      height: 40px;
      max-width: 180px;
      object-fit: contain;
    }

    .menu-section {
      padding: 20px 12px 8px;
    }

    .menu-section-title {
      font-size: 13px;
      color: #888;
      font-weight: 500;
      padding: 0 12px 10px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      color: #333;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 2px;
    }

    .menu-item:hover {
      background: #f5f5f5;
    }

    .menu-item.active {
      background: #f0f7eb;
      color: #3d6b1e;
    }

    .signout-item {
      color: #d32f2f !important;
    }

    /* CONTENT */

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #666;
      font-size: 15px;
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    /* LOADING */

    .loading {
      background: white;
      border: 1px solid #eee;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }

    .error-box {
      background: #fff1f1;
      border: 1px solid #ffd0d0;
      color: #c62828;
      border-radius: 14px;
      padding: 15px;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    /* PLATFORMS */

    .platforms-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 28px;
    }

    .platform-card {
      background: white;
      border: 1.5px solid #e8e8e8;
      border-radius: 14px;
      padding: 16px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .platform-card:hover {
      border-color: #3d6b1e;
    }

    .platform-card.active {
      border-color: #3d6b1e;
      background: #f0f7eb;
    }

    .platform-icon {
      font-size: 26px;
      margin-bottom: 6px;
    }

    .platform-name {
      font-size: 13px;
      font-weight: 500;
    }

    /* SERVICES */

    .services-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 30px;
    }

    .service-card {
      background: white;
      border: 1.5px solid #e8e8e8;
      border-radius: 14px;
      padding: 15px 12px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }

    .service-card:hover {
      border-color: #3d6b1e;
    }

    .service-card.active {
      border-color: #3d6b1e;
      background: #f0f7eb;
    }

    .service-name {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 7px;
    }

    .service-price {
      font-size: 12px;
      color: #3d6b1e;
      font-weight: 600;
    }

    .service-info {
      font-size: 11px;
      color: #888;
      margin-top: 5px;
      line-height: 1.35;
    }

    .buy-btn {
      width: 100%;
      padding: 16px;
      background: #3d6b1e;
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .buy-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    /* CHAT */

    .chat-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .chat-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .chat-box {
      background: white;
      width: 100%;
      max-width: 420px;
      height: 75vh;
      max-height: 620px;
      border-radius: 20px 20px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(100%);
      transition: transform 0.35s ease;
    }

    .chat-overlay.active .chat-box {
      transform: translateY(0);
    }

    .chat-header {
      padding: 16px 20px;
      background: #3d6b1e;
      color: white;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-small {
      width: 38px;
      height: 38px;
      background: white;
      color: #3d6b1e;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
    }

    .chat-header-info h3 {
      font-size: 16px;
      font-weight: 600;
    }

    .chat-header-info p {
      font-size: 12px;
      opacity: 0.85;
    }

    .chat-messages {
      flex: 1;
      padding: 20px 16px;
      overflow-y: auto;
      background: #f7f7f7;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.45;
      animation: fadeIn 0.3s ease;
    }

    .message.bot {
      background: white;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    .message.user {
      background: #3d6b1e;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .chat-input-area {
      padding: 12px 16px;
      background: white;
      border-top: 1px solid #eee;
      display: flex;
      gap: 10px;
    }

    .chat-input-area input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 25px;
      font-size: 15px;
      outline: none;
    }

    .chat-input-area button {
      background: #3d6b1e;
      color: white;
      border: none;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
    }

    .chat-input-area input:disabled,
    .chat-input-area button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .typing {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      background: white;
      border-radius: 18px;
      align-self: flex-start;
      width: fit-content;
    }

    .typing span {
      width: 7px;
      height: 7px;
      background: #999;
      border-radius: 50%;
      animation: typing 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.4;
      }

      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      updateDoc,
      doc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


    /* =========================================================
       FIREBASE
    ========================================================= */

    const firebaseConfig = {
      apiKey: "AIzaSyDDutrOemL5dqk4hIdQ1K2QmhiBhtegv8k",
      authDomain: "trustsocials-8fc8b.firebaseapp.com",
      projectId: "trustsocials-8fc8b",
      storageBucket: "trustsocials-8fc8b.firebasestorage.app",
      messagingSenderId: "675550258010",
      appId: "1:675550258010:web:ec6444eb22b04a92fd0963",
      measurementId: "G-KDVYRV55JD"
    };

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    /* =========================================================
       CONFIG
    ========================================================= */

    const API_URL =
      "https://pdsboost-proxy.netlify.app/.netlify/functions/api";

    // 30% markup
    const MARKUP = 0.30;


    /* =========================================================
       STATE
    ========================================================= */

    let currentUser = null;

    let allServices = [];

    let selectedPlatform = null;

    let selectedService = null;

    let chatStep = 0;

    let userLink = "";

    let userQuantity = "";


    /* =========================================================
       DOM
    ========================================================= */

    const loadingBox =
      document.getElementById("loadingBox");

    const errorBox =
      document.getElementById("errorBox");

    const serviceContent =
      document.getElementById("serviceContent");

    const platformsGrid =
      document.getElementById("platformsGrid");

    const servicesGrid =
      document.getElementById("servicesGrid");

    const buyBtn =
      document.getElementById("buyBtn");

    const chatOverlay =
      document.getElementById("chatOverlay");

    const chatMessages =
      document.getElementById("chatMessages");

    const chatInput =
      document.getElementById("chatInput");

    const sendBtn =
      document.getElementById("sendBtn");


    /* =========================================================
       SIDEBAR
    ========================================================= */

    const sidebar =
      document.getElementById("sidebar");

    const overlay =
      document.getElementById("sidebarOverlay");

    document
      .getElementById("menuToggle")
      .addEventListener("click", () => {

        sidebar.classList.add("active");

        overlay.classList.add("active");

        document.body.style.overflow = "hidden";

      });


    overlay.addEventListener("click", () => {

      sidebar.classList.remove("active");

      overlay.classList.remove("active");

      document.body.style.overflow = "";

    });


    window.addEventListener("scroll", () => {

      document
        .getElementById("header")
        .classList.toggle(
          "scrolled",
          window.scrollY > 10
        );

    });


    document
      .getElementById("signOutBtn")
      .addEventListener("click", async (event) => {

        event.preventDefault();

        await signOut(auth);

        window.location.href = "login.html";

      });


    /* =========================================================
       AUTH
    ========================================================= */

    onAuthStateChanged(auth, async (user) => {

      if (!user) {

        window.location.href = "login.html";

        return;

      }

      currentUser = user;

      const displayName =
        user.displayName ||
        (user.email
          ? user.email.split("@")[0]
          : "User");

      const names =
        displayName.trim().split(" ");

      let initials =
        names[0].charAt(0).toUpperCase();

      if (names.length > 1) {

        initials +=
          names[names.length - 1]
            .charAt(0)
            .toUpperCase();

      }

      document
        .getElementById("userAvatar")
        .textContent = initials;


      await loadServices();

    });


    /* =========================================================
       API CALL
    ========================================================= */

    async function callProxy(payload) {

      const response =
        await fetch(API_URL, {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify(payload)

        });


      let data;

      try {

        data = await response.json();

      } catch {

        throw new Error(
          "The proxy returned an invalid response."
        );

      }


      if (!response.ok) {

        throw new Error(
          data.error ||
          `Proxy error ${response.status}`
        );

      }


      if (data.error) {

        throw new Error(data.error);

      }


      return data;

    }


    /* =========================================================
       LOAD REAL PDSBOOST SERVICES
    ========================================================= */

    async function loadServices() {

      loadingBox.style.display = "block";

      serviceContent.style.display = "none";

      errorBox.style.display = "none";


      try {

        const data =
          await callProxy({
            action: "services"
          });


        /*
          PdsBoost normally returns an array:

          [
            {
              service: "1",
              name: "...",
              type: "...",
              category: "...",
              rate: "...",
              min: "...",
              max: "..."
            }
          ]
        */


        if (!Array.isArray(data)) {

          throw new Error(
            "The services response is not an array."
          );

        }


        allServices =
          data
            .filter(service => {

              return (
                service &&
                service.service != null &&
                service.name
              );

            })
            .map(service => {

              const rate =
                Number(service.rate) || 0;

              const min =
                Number(service.min) || 0;

              const max =
                Number(service.max) || 0;


              return {

                ...service,

                service:
                  String(service.service),

                rate,

                min,

                max,

                sellingRate:
                  rate * (1 + MARKUP)

              };

            })
            .filter(service => {

              return (
                service.rate > 0 &&
                service.min >= 0 &&
                service.max >= 0
              );

            });


        if (!allServices.length) {

          throw new Error(
            "No usable services were returned by PdsBoost."
          );

        }


        loadingBox.style.display = "none";

        serviceContent.style.display = "block";


        renderPlatforms();


      } catch (error) {

        loadingBox.style.display = "none";

        errorBox.style.display = "block";

        errorBox.textContent =
          "Unable to load SME services: " +
          error.message;

      }

    }


    /* =========================================================
       PLATFORM DETECTION
    ========================================================= */

    function getPlatform(service) {

      const text = (

        String(service.category || "") +
        " " +
        String(service.name || "")

      ).toLowerCase();


      if (
        text.includes("instagram") ||
        text.includes("ig")
      ) {
        return "Instagram";
      }

      if (
        text.includes("facebook") ||
        text.includes("fb")
      ) {
        return "Facebook";
      }

      if (
        text.includes("tiktok") ||
        text.includes("tik tok")
      ) {
        return "TikTok";
      }

      if (
        text.includes("youtube") ||
        text.includes("youtube")
      ) {
        return "YouTube";
      }

      if (
        text.includes("twitter") ||
        text.includes("twitter/x") ||
        text.includes(" x ")
      ) {
        return "Twitter/X";
      }

      if (
        text.includes("telegram")
      ) {
        return "Telegram";
      }

      if (
        text.includes("threads")
      ) {
        return "Threads";
      }

      if (
        text.includes("linkedin")
      ) {
        return "LinkedIn";
      }

      if (
        text.includes("spotify")
      ) {
        return "Spotify";
      }

      if (
        text.includes("snapchat")
      ) {
        return "Snapchat";
      }

      return (
        service.category ||
        "Other"
      );

    }


    function getPlatformIcon(platform) {

      const icons = {

        Instagram: "📸",

        Facebook: "👤",

        TikTok: "🎵",

        YouTube: "▶️",

        "Twitter/X": "𝕏",

        Telegram: "✈️",

        Threads: "◉",

        LinkedIn: "in",

        Spotify: "●",

        Snapchat: "👻",

        Other: "•"

      };


      return icons[platform] || "•";

    }


    /* =========================================================
       RENDER PLATFORMS
    ========================================================= */

    function renderPlatforms() {

      platformsGrid.innerHTML = "";

      const platforms = [
        ...new Set(
          allServices.map(getPlatform)
        )
      ];


      platforms.sort();


      platforms.forEach(platform => {

        const card =
          document.createElement("div");

        card.className =
          "platform-card";


        card.innerHTML = `

          <div class="platform-icon">
            ${getPlatformIcon(platform)}
          </div>

          <div class="platform-name">
            ${escapeHTML(platform)}
          </div>

        `;


        card.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(
                ".platform-card"
              )
              .forEach(card => {

                card.classList.remove(
                  "active"
                );

              });


            card.classList.add("active");

            selectedPlatform =
              platform;

            selectedService = null;

            renderServices();

            updateBuyButton();

          }
        );


        platformsGrid.appendChild(card);

      });


      if (!platforms.length) {

        platformsGrid.innerHTML =
          `<div style="grid-column:1/-1;color:#777;">
            No platforms available.
          </div>`;

      }

    }


    /* =========================================================
       RENDER SERVICES
    ========================================================= */

    function renderServices() {

      servicesGrid.innerHTML = "";

      selectedService = null;


      const services =
        allServices.filter(service => {

          return (
            getPlatform(service) ===
            selectedPlatform
          );

        });


      services.forEach(service => {

        const card =
          document.createElement("div");

        card.className =
          "service-card";


        const sellingRate =
          formatMoney(
            service.sellingRate
          );


        const min =
          formatNumber(service.min);

        const max =
          formatNumber(service.max);


        card.innerHTML = `

          <div class="service-name">
            ${escapeHTML(service.name)}
          </div>

          <div class="service-price">
            ₦${sellingRate} / 1,000
          </div>

          <div class="service-info">
            Min ${min} · Max ${max}
          </div>

        `;


        card.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(
                ".service-card"
              )
              .forEach(c => {

                c.classList.remove(
                  "active"
                );

              });


            card.classList.add("active");

            selectedService =
              service;

            updateBuyButton();

          }
        );


        servicesGrid.appendChild(card);

      });


      if (!services.length) {

        servicesGrid.innerHTML = `

          <div style="
            grid-column:1/-1;
            background:white;
            border:1px solid #eee;
            border-radius:14px;
            padding:20px;
            text-align:center;
            color:#777;
          ">
            No services available for this platform.
          </div>

        `;

      }

    }


    /* =========================================================
       BUY BUTTON
    ========================================================= */

    function updateBuyButton() {

      if (
        selectedPlatform &&
        selectedService
      ) {

        buyBtn.disabled = false;

        buyBtn.textContent =
          `Buy ${selectedService.name}`;

      } else {

        buyBtn.disabled = true;

        buyBtn.textContent =
          "Select Platform & Service first";

      }

    }


    buyBtn.addEventListener(
      "click",
      () => {

        if (!selectedService) return;

        startChat();

      }
    );


    /* =========================================================
       CHAT
    ========================================================= */

    function startChat() {

      chatMessages.innerHTML = "";

      chatStep = 0;

      userLink = "";

      userQuantity = "";


      chatOverlay.classList.add(
        "active"
      );


      setTimeout(() => {

        addBotMessage(`

          You selected
          <b>${escapeHTML(selectedService.name)}</b>
          for
          <b>${escapeHTML(selectedPlatform)}</b>.

          <br><br>

          Price:
          <b>₦${formatMoney(selectedService.sellingRate)}</b>
          per 1,000.

        `);


        setTimeout(() => {

          addBotMessage(`

            Minimum:
            <b>${formatNumber(selectedService.min)}</b>

            <br>

            Maximum:
            <b>${formatNumber(selectedService.max)}</b>

            <br><br>

            Please send the
            <b>Link</b>
            of the account/post:

          `);

          chatInput.focus();

        }, 800);

      }, 300);

    }


    function addBotMessage(text) {

      const msg =
        document.createElement("div");

      msg.className =
        "message bot";

      msg.innerHTML = text;

      chatMessages.appendChild(msg);

      chatMessages.scrollTop =
        chatMessages.scrollHeight;

    }


    function addUserMessage(text) {

      const msg =
        document.createElement("div");

      msg.className =
        "message user";

      msg.textContent = text;

      chatMessages.appendChild(msg);

      chatMessages.scrollTop =
        chatMessages.scrollHeight;

    }


    function showTyping() {

      removeTyping();


      const typing =
        document.createElement("div");

      typing.className =
        "typing";

      typing.id =
        "typingIndicator";

      typing.innerHTML =
        "<span></span><span></span><span></span>";


      chatMessages.appendChild(typing);

      chatMessages.scrollTop =
        chatMessages.scrollHeight;

    }


    function removeTyping() {

      const typing =
        document.getElementById(
          "typingIndicator"
        );

      if (typing) {
        typing.remove();
      }

    }


    sendBtn.addEventListener(
      "click",
      handleUserInput
    );


    chatInput.addEventListener(
      "keypress",
      event => {

        if (event.key === "Enter") {

          event.preventDefault();

          handleUserInput();

        }

      }
    );


    async function handleUserInput() {

      const text =
        chatInput.value.trim();


      if (!text) return;


      addUserMessage(text);

      chatInput.value = "";


      /* LINK */

      if (chatStep === 0) {

        userLink = text;

        chatStep = 1;

        showTyping();


        setTimeout(() => {

          removeTyping();


          addBotMessage(`

            Great.

            Now send the
            <b>Quantity</b>
            you want.

            <br><br>

            Min:
            <b>${formatNumber(selectedService.min)}</b>

            <br>

            Max:
            <b>${formatNumber(selectedService.max)}</b>

          `);


          chatInput.focus();

        }, 600);


        return;

      }


      /* QUANTITY */

      if (chatStep === 1) {

        const quantity =
          Number(
            text.replace(/,/g, "")
          );


        if (
          !Number.isFinite(quantity) ||
          quantity <= 0
        ) {

          addBotMessage(
            "Please enter a valid quantity."
          );

          return;

        }


        if (
          quantity <
          selectedService.min
        ) {

          addBotMessage(`

            The minimum quantity for this
            service is
            <b>${formatNumber(selectedService.min)}</b>.

          `);

          return;

        }


        if (
          quantity >
          selectedService.max
        ) {

          addBotMessage(`

            The maximum quantity for this
            service is
            <b>${formatNumber(selectedService.max)}</b>.

          `);

          return;

        }


        userQuantity =
          String(Math.floor(quantity));

        chatStep = 2;

        await placeRealOrder();

      }

    }


    /* =========================================================
       PLACE REAL ORDER
    ========================================================= */

    async function placeRealOrder() {

      if (!currentUser) {

        addBotMessage(
          "Please sign in before placing an order."
        );

        return;

      }


      const quantity =
        Number(userQuantity);


      /*
        PdsBoost rates are normally calculated
        per 1,000 units.

        API cost:
          rate × quantity / 1000

        Your price:
          API cost × 1.30
      */

      const apiCost =
        selectedService.rate *
        quantity /
        1000;


      const customerPrice =
        selectedService.sellingRate *
        quantity /
        1000;


      const roundedPrice =
        Number(
          customerPrice.toFixed(2)
        );


      const roundedApiCost =
        Number(
          apiCost.toFixed(2)
        );


      showTyping();


      addBotMessage(`

        Order total:
        <b>₦${formatMoney(roundedPrice)}</b>

        <br><br>

        Placing your order, please wait...

      `);


      let orderDocumentId = null;


      try {

        /*
          Create the Firebase order first.
          This makes the order visible as
          "processing" while PdsBoost handles it.
        */

        const orderDoc =
          await addDoc(
            collection(db, "orders"),
            {

              userId:
                currentUser.uid,

              userEmail:
                currentUser.email || "",

              type:
                "sme_boosting",

              platform:
                selectedPlatform,

              serviceId:
                String(selectedService.service),

              serviceName:
                selectedService.name,

              category:
                selectedService.category || "",

              link:
                userLink,

              quantity:
                quantity,

              apiRate:
                selectedService.rate,

              sellingRate:
                selectedService.sellingRate,

              apiCost:
                roundedApiCost,

              amount:
                roundedPrice,

              markup:
                30,

              providerOrderId:
                null,

              status:
                "processing",

              createdAt:
                serverTimestamp(),

              updatedAt:
                serverTimestamp()

            }
          );


        orderDocumentId =
          orderDoc.id;


        /*
          Send the real order to PdsBoost.
        */

        const data =
          await callProxy({

            action: "add",

            service:
              String(selectedService.service),

            link:
              userLink,

            quantity:
              String(quantity)

          });


        /*
          PdsBoost normally returns:
            { order: "123456" }
        */

        if (!data.order) {

          throw new Error(
            data.error ||
            "PdsBoost did not return an order ID."
          );

        }


        /*
          Update the Firebase order
          with the provider order ID.
        */

        await updateDoc(
          doc(
            db,
            "orders",
            orderDocumentId
          ),
          {

            providerOrderId:
              String(data.order),

            status:
              "pending",

            updatedAt:
              serverTimestamp()

          }
        );


        removeTyping();


        addBotMessage(`

          <b>Order placed successfully.</b>

          <br><br>

          <b>Order ID:</b>
          ${escapeHTML(String(data.order))}

          <br>

          <b>Platform:</b>
          ${escapeHTML(selectedPlatform)}

          <br>

          <b>Service:</b>
          ${escapeHTML(selectedService.name)}

          <br>

          <b>Quantity:</b>
          ${formatNumber(quantity)}

          <br>

          <b>Total:</b>
          ₦${formatMoney(roundedPrice)}

          <br><br>

          Your order has been added to
          your orders.

        `);


        disableChat();


      } catch (error) {

        console.error(
          "Order error:",
          error
        );


        /*
          If Firebase order was created but
          the provider failed, mark it failed.
        */

        if (orderDocumentId) {

          try {

            await updateDoc(
              doc(
                db,
                "orders",
                orderDocumentId
              ),
              {

                status:
                  "failed",

                error:
                  error.message,

                updatedAt:
                  serverTimestamp()

              }
            );

          } catch (firebaseError) {

            console.error(
              "Could not update failed order:",
              firebaseError
            );

          }

        }


        removeTyping();


        addBotMessage(`

          <b>Order could not be completed.</b>

          <br><br>

          ${escapeHTML(error.message)}

          <br><br>

          Please try again.

        `);


        chatStep = 1;

      }

    }


    /* =========================================================
       CHAT DISABLE
    ========================================================= */

    function disableChat() {

      chatInput.disabled = true;

      sendBtn.disabled = true;

    }


    /* =========================================================
       HELPERS
    ========================================================= */

    function formatMoney(value) {

      return Number(value || 0)
        .toLocaleString(
          "en-NG",
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        );

    }


    function formatNumber(value) {

      return Number(value || 0)
        .toLocaleString("en-NG");

    }


    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

  </script>

</body>
