<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Products - Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8f9fa;
      color: #111;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .header {
      position: sticky; top: 0; z-index: 100;
      background: #fff; padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #eee;
    }
    .menu-toggle { background: none; border: none; cursor: pointer; padding: 4px; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .admin-badge {
      background: #3d6b1e; color: white; font-size: 12px;
      padding: 4px 10px; border-radius: 20px; font-weight: 500;
    }
    .avatar {
      width: 36px; height: 36px; background: #3d6b1e; color: white;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 14px;
    }

    .sidebar-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200;
      opacity: 0; visibility: hidden; transition: all 0.3s ease;
    }
    .sidebar-overlay.active { opacity: 1; visibility: visible; }
    .sidebar {
      position: fixed; top: 0; left: 0; width: 300px; height: 100%;
      background: white; z-index: 300; transform: translateX(-100%);
      transition: transform 0.3s ease; overflow-y: auto; padding: 20px 0 30px;
    }
    .sidebar.active { transform: translateX(0); }
    .sidebar-logo { padding: 0 20px 20px; border-bottom: 1px solid #eee; }
    .sidebar-logo img { height: 40px; }
    .menu-section { padding: 20px 12px 8px; }
    .menu-section-title {
      font-size: 13px; color: #888; font-weight: 500; padding: 0 12px 10px;
      text-transform: uppercase;
    }
    .menu-item {
      display: flex; align-items: center; gap: 14px; padding: 12px 14px;
      border-radius: 12px; color: #333; text-decoration: none; font-size: 15px;
      font-weight: 500; margin-bottom: 2px;
    }
    .menu-item:hover { background: #f5f5f5; }
    .menu-item.active { background: #f0f7eb; color: #3d6b1e; }
    .signout-item { color: #d32f2f !important; }

    .container { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }

    .add-btn {
      width: 100%;
      padding: 14px;
      background: #3d6b1e;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .product-card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid #f0f0f0;
    }
    .product-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .product-meta { font-size: 13px; color: #666; margin-bottom: 8px; }
    .product-price { font-size: 16px; font-weight: 700; color: #3d6b1e; }

    /* Form Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000;
      display: flex; align-items: flex-end; justify-content: center;
      opacity: 0; visibility: hidden; transition: all 0.3s;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }

    .modal {
      background: white;
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 20px 20px 0 0;
      padding: 20px;
    }
    .modal h3 { font-size: 18px; margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block; font-size: 13px; font-weight: 500; margin-bottom: 5px;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }
    .form-group textarea { min-height: 80px; resize: vertical; }

    .modal-actions { display: flex; gap: 10px; margin-top: 10px; }
    .modal-btn {
      flex: 1; padding: 13px; border-radius: 10px; border: none;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .btn-save { background: #3d6b1e; color: white; }
    .btn-cancel { background: #f0f0f0; color: #333; }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="logo.png" alt="Temmy Social">
    </div>
    <div class="menu-section">
      <div class="menu-section-title">Admin</div>
      <a href="admin.html" class="menu-item">Dashboard</a>
      <a href="admin-users.html" class="menu-item">Users</a>
      <a href="admin-deposits.html" class="menu-item">Deposits</a>
      <a href="admin-products.html" class="menu-item active">Products</a>
      <a href="admin-orders.html" class="menu-item">Orders</a>
    </div>
    <div class="menu-section">
      <div class="menu-section-title">Main Site</div>
      <a href="dashboard.html" class="menu-item">User Dashboard</a>
    </div>
    <div class="menu-section" style="border-top:1px solid #eee; margin-top:10px; padding-top:10px;">
      <a href="#" class="menu-item signout-item" id="signOutBtn">Sign out</a>
    </div>
  </div>

  <header class="header">
    <button class="menu-toggle" id="menuToggle">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
      </svg>
    </button>
    <div class="header-right">
      <span class="admin-badge">Admin</span>
      <div class="avatar">AD</div>
    </div>
  </header>

  <div class="container">
    <h1>Manage Products</h1>
    <p class="subtitle">Add products to Logs Store & Tools Store</p>

    <button class="add-btn" id="addProductBtn">+ Add New Product</button>

    <div id="productsList">
      <p style="text-align:center;color:#888;padding:40px 0">Loading products...</p>
    </div>
  </div>

  <!-- Add / Edit Product Modal -->
  <div class="modal-overlay" id="productModal">
    <div class="modal">
      <h3 id="modalTitle">Add New Product</h3>

      <div class="form-group">
        <label>Store Type</label>
        <select id="productCategory">
          <option value="logs">Logs Store</option>
          <option value="tools">Tools Store</option>
        </select>
      </div>

      <div class="form-group">
        <label>Title</label>
        <input type="text" id="productTitle" placeholder="Product name">
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="productDescription" placeholder="Product description"></textarea>
      </div>

      <div class="form-group">
        <label>Price (₦)</label>
        <input type="number" id="productPrice" placeholder="1950">
      </div>

      <div class="form-group">
        <label>Stock</label>
        <input type="number" id="productStock" placeholder="10">
      </div>

      <div class="form-group">
        <label>Sub Category (for Tools)</label>
        <select id="productSubCategory">
          <option value="">None</option>
          <option value="working-pictures">Working pictures</option>
          <option value="working-tools">Working tools</option>
        </select>
      </div>

      <div class="form-group">
        <label>Category Name (for Logs)</label>
        <input type="text" id="productCategoryName" placeholder="e.g. USA HIGH QUALITY TIKTOK">
      </div>

      <div class="form-group">
        <label>Image URL (direct link)</label>
        <input type="text" id="productImage" placeholder="https://...">
      </div>

      <div class="form-group">
        <label>Icon / Short Name</label>
        <input type="text" id="productShortName" placeholder="text+">
      </div>

      <div class="form-group">
        <label>SKU</label>
        <input type="text" id="productSku" placeholder="#15ef16">
      </div>

      <div class="form-group">
        <label>Secret Credential</label>
        <textarea id="productCredential" placeholder="email:xxx password:xxx"></textarea>
      </div>

      <div class="modal-actions">
        <button class="modal-btn btn-cancel" id="cancelProductBtn">Cancel</button>
        <button class="modal-btn btn-save" id="saveProductBtn">Save Product</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { 
      getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc 
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDDutrOemL5dqk4hIdQ1K2QmhiBhtegv8k",
      authDomain: "trustsocials-8fc8b.firebaseapp.com",
      projectId: "trustsocials-8fc8b",
      storageBucket: "trustsocials-8fc8b.firebasestorage.app",
      messagingSenderId: "675550258010",
      appId: "1:675550258010:web:ec6444eb22b04a92fd0963",
      measurementId: "G-KDVYRV55JD"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ADMIN_EMAIL = "danielidoghe@gmail.com";
    let editingId = null;

    // Sidebar
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    document.getElementById('menuToggle').addEventListener('click', () => {
      sidebar.classList.add('active');
      overlay.classList.add('active');
    });
    overlay.addEventListener('click', () => {
      sidebar.classList.remove('active');
      overlay.classList.remove('active');
    });

    document.getElementById('signOutBtn').addEventListener('click', async (e) => {
      e.preventDefault();
      await signOut(auth);
      window.location.href = 'login.html';
    });

    // Modal
    const modal = document.getElementById('productModal');
    document.getElementById('addProductBtn').addEventListener('click', () => {
      editingId = null;
      document.getElementById('modalTitle').textContent = 'Add New Product';
      clearForm();
      modal.classList.add('active');
    });
    document.getElementById('cancelProductBtn').addEventListener('click', () => {
      modal.classList.remove('active');
    });

    function clearForm() {
      document.getElementById('productCategory').value = 'logs';
      document.getElementById('productTitle').value = '';
      document.getElementById('productDescription').value = '';
      document.getElementById('productPrice').value = '';
      document.getElementById('productStock').value = '';
      document.getElementById('productSubCategory').value = '';
      document.getElementById('productCategoryName').value = '';
      document.getElementById('productImage').value = '';
      document.getElementById('productShortName').value = '';
      document.getElementById('productSku').value = '';
      document.getElementById('productCredential').value = '';
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      if (user.email !== ADMIN_EMAIL) {
        alert('Access denied');
        window.location.href = 'dashboard.html';
        return;
      }
      loadProducts();
    });

    async function loadProducts() {
      const list = document.getElementById('productsList');
      try {
        const snap = await getDocs(collection(db, 'products'));
        if (snap.empty) {
          list.innerHTML = `<p style="text-align:center;color:#888;padding:40px 0">No products yet</p>`;
          return;
        }

        let html = '';
        snap.forEach(docSnap => {
          const p = docSnap.data();
          html += `
            <div class="product-card">
              <div class="product-title">${p.title || 'Untitled'}</div>
              <div class="product-meta">
                ${p.category === 'logs' ? 'Logs Store' : 'Tools Store'} • Stock: ${p.stock || 0}
              </div>
              <div class="product-price">₦${Number(p.price || 0).toLocaleString()}</div>
            </div>
          `;
        });
        list.innerHTML = html;
      } catch (err) {
        console.error(err);
        list.innerHTML = `<p style="text-align:center;color:#c5221f">Failed to load products</p>`;
      }
    }

    // Save Product
    document.getElementById('saveProductBtn').addEventListener('click', async () => {
      const title = document.getElementById('productTitle').value.trim();
      const price = Number(document.getElementById('productPrice').value);
      const stock = Number(document.getElementById('productStock').value);

      if (!title || !price) {
        alert('Title and Price are required');
        return;
      }

      const data = {
        title,
        description: document.getElementById('productDescription').value.trim(),
        price,
        stock: stock || 0,
        category: document.getElementById('productCategory').value,
        subCategory: document.getElementById('productSubCategory').value || null,
        categoryName: document.getElementById('productCategoryName').value.trim() || null,
        imageUrl: document.getElementById('productImage').value.trim() || null,
        shortName: document.getElementById('productShortName').value.trim() || null,
        sku: document.getElementById('productSku').value.trim() || null,
        credential: document.getElementById('productCredential').value.trim() || '',
        createdAt: new Date()
      };

      try {
        if (editingId) {
          await updateDoc(doc(db, 'products', editingId), data);
          alert('Product updated');
        } else {
          await addDoc(collection(db, 'products'), data);
          alert('Product added successfully');
        }
        modal.classList.remove('active');
        loadProducts();
      } catch (err) {
        console.error(err);
        alert('Failed to save product');
      }
    });
  </script>
</body>
</html>
