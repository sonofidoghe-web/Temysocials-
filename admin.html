<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Temmy Social</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8f9fa;
      color: #111;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* Header */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: #fff; padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #eee;
    }
    .menu-toggle { background: none; border: none; cursor: pointer; padding: 4px; color: #333; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .avatar {
      width: 36px; height: 36px; background: #3d6b1e; color: white;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 14px;
    }
    .admin-badge {
      background: #3d6b1e; color: white; font-size: 12px;
      padding: 4px 10px; border-radius: 20px; font-weight: 500;
    }

    /* Sidebar */
    .sidebar-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200;
      opacity: 0; visibility: hidden; transition: all 0.3s ease;
    }
    .sidebar-overlay.active { opacity: 1; visibility: visible; }
    .sidebar {
      position: fixed; top: 0; left: 0; width: 300px; height: 100%;
      background: white; z-index: 300; transform: translateX(-100%);
      transition: transform 0.3s ease; overflow-y: auto; padding: 20px 0 30px;
    }
    .sidebar.active { transform: translateX(0); }
    .sidebar-logo { padding: 0 20px 20px; border-bottom: 1px solid #eee; }
    .sidebar-logo img { height: 40px; }
    .menu-section { padding: 20px 12px 8px; }
    .menu-section-title {
      font-size: 13px; color: #888; font-weight: 500; padding: 0 12px 10px;
      text-transform: uppercase;
    }
    .menu-item {
      display: flex; align-items: center; gap: 14px; padding: 12px 14px;
      border-radius: 12px; color: #333; text-decoration: none; font-size: 15px;
      font-weight: 500; margin-bottom: 2px;
    }
    .menu-item:hover { background: #f5f5f5; }
    .menu-item.active { background: #f0f7eb; color: #3d6b1e; }
    .signout-item { color: #d32f2f !important; }

    /* Content */
    .container { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { color: #666; font-size: 15px; margin-bottom: 24px; }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: white;
      border-radius: 14px;
      padding: 18px 16px;
      border: 1px solid #f0f0f0;
    }
    .stat-card .label { font-size: 13px; color: #666; margin-bottom: 6px; }
    .stat-card .value { font-size: 22px; font-weight: 700; color: #3d6b1e; }

    .section-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .admin-menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .admin-link {
      background: white;
      border: 1px solid #f0f0f0;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: #111;
      font-weight: 500;
    }
    .admin-link:hover { border-color: #3d6b1e; }
    .admin-link span { color: #3d6b1e; font-size: 18px; }
  </style>
</head>
<body>

  <!-- SIDEBAR OVERLAY -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="logo.png" alt="Temmy Social">
    </div>

    <div class="menu-section">
      <div class="menu-section-title">Admin</div>
      <a href="admin.html" class="menu-item active">Dashboard</a>
      <a href="admin-users.html" class="menu-item">Users</a>
      <a href="admin-deposits.html" class="menu-item">Deposits</a>
      <a href="admin-products.html" class="menu-item">Products</a>
      <a href="admin-orders.html" class="menu-item">Orders</a>
    </div>

    <div class="menu-section">
      <div class="menu-section-title">Main Site</div>
      <a href="dashboard.html" class="menu-item">User Dashboard</a>
    </div>

    <div class="menu-section" style="border-top:1px solid #eee; margin-top:10px; padding-top:10px;">
      <a href="#" class="menu-item signout-item" id="signOutBtn">Sign out</a>
    </div>
  </div>

  <!-- HEADER -->
  <header class="header">
    <button class="menu-toggle" id="menuToggle">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
      </svg>
    </button>
    <div class="header-right">
      <span class="admin-badge">Admin</span>
      <div class="avatar" id="userAvatar">AD</div>
    </div>
  </header>

  <div class="container">
    <h1>Admin Panel</h1>
    <p class="subtitle">Welcome back, Administrator</p>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">Total Users</div>
        <div class="value" id="totalUsers">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Total Sales</div>
        <div class="value" id="totalSales">₦0</div>
      </div>
      <div class="stat-card">
        <div class="label">Pending Deposits</div>
        <div class="value" id="pendingDeposits">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Total Orders</div>
        <div class="value" id="totalOrders">0</div>
      </div>
    </div>

    <div class="section-title">Quick Actions</div>
    <div class="admin-menu">
      <a href="admin-users.html" class="admin-link">
        Manage Users <span>→</span>
      </a>
      <a href="admin-deposits.html" class="admin-link">
        Approve Deposits <span>→</span>
      </a>
      <a href="admin-products.html" class="admin-link">
        Manage Products (Logs & Tools) <span>→</span>
      </a>
      <a href="admin-orders.html" class="admin-link">
        View Orders <span>→</span>
      </a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDDutrOemL5dqk4hIdQ1K2QmhiBhtegv8k",
      authDomain: "trustsocials-8fc8b.firebaseapp.com",
      projectId: "trustsocials-8fc8b",
      storageBucket: "trustsocials-8fc8b.firebasestorage.app",
      messagingSenderId: "675550258010",
      appId: "1:675550258010:web:ec6444eb22b04a92fd0963",
      measurementId: "G-KDVYRV55JD"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ADMIN EMAIL
    const ADMIN_EMAIL = "danielidoghe@gmail.com";

    // Sidebar
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    document.getElementById('menuToggle').addEventListener('click', () => {
      sidebar.classList.add('active');
      overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    });
    overlay.addEventListener('click', () => {
      sidebar.classList.remove('active');
      overlay.classList.remove('active');
      document.body.style.overflow = '';
    });

    document.getElementById('signOutBtn').addEventListener('click', async (e) => {
      e.preventDefault();
      await signOut(auth);
      window.location.href = 'login.html';
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      // ===== ADMIN PROTECTION =====
      if (user.email !== ADMIN_EMAIL) {
        alert('Access denied. Admins only.');
        window.location.href = 'dashboard.html';
        return;
      }

      // Avatar
      document.getElementById('userAvatar').textContent = 'AD';

      // Load stats
      try {
        // Total Users
        const usersSnap = await getDocs(collection(db, 'users'));
        document.getElementById('totalUsers').textContent = usersSnap.size;

        // Pending Deposits
        const pendingSnap = await getDocs(query(collection(db, 'transactions'), where('status', '==', 'pending'), where('type', '==', 'topup')));
        document.getElementById('pendingDeposits').textContent = pendingSnap.size;

        // Total Orders
        const ordersSnap = await getDocs(collection(db, 'orders'));
        document.getElementById('totalOrders').textContent = ordersSnap.size;

        // Total Sales (sum of completed purchases)
        let totalSales = 0;
        const salesSnap = await getDocs(query(collection(db, 'transactions'), where('type', '==', 'purchase'), where('status', '==', 'completed')));
        salesSnap.forEach(doc => {
          totalSales += Math.abs(doc.data().amount || 0);
        });
        document.getElementById('totalSales').textContent = `₦${totalSales.toLocaleString()}`;

      } catch (err) {
        console.error(err);
      }
    });
  </script>
</body>
</html>
