<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMS Numbers - TrustSocial</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8f9fa;
      color: #111;
      min-height: 100vh;
      padding-bottom: 50px;
    }

    /* Header */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: #fff; padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #eee; transition: all 0.3s ease;
    }
    .header.scrolled {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
    }
    .menu-toggle { background: none; border: none; cursor: pointer; padding: 4px; color: #333; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .badge-no { background: #f0f0f0; color: #555; font-size: 13px; font-weight: 500; padding: 4px 10px; border-radius: 20px; }
    .icon-btn { background: none; border: none; cursor: pointer; padding: 4px; color: #444; }
    .avatar {
      width: 36px; height: 36px; background: #3d6b1e; color: white;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 14px;
    }

    /* Sidebar */
    .sidebar-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200;
      opacity: 0; visibility: hidden; transition: all 0.3s ease;
    }
    .sidebar-overlay.active { opacity: 1; visibility: visible; }
    .sidebar {
      position: fixed; top: 0; left: 0; width: 300px; height: 100%;
      background: white; z-index: 300; transform: translateX(-100%);
      transition: transform 0.3s ease; overflow-y: auto; padding: 20px 0 30px;
    }
    .sidebar.active { transform: translateX(0); }
    .sidebar-logo { padding: 0 20px 20px; border-bottom: 1px solid #eee; }
    .sidebar-logo img { height: 40px; }
    .menu-section { padding: 20px 12px 8px; }
    .menu-section-title {
      font-size: 13px; color: #888; font-weight: 500; padding: 0 12px 10px;
      text-transform: uppercase; letter-spacing: 0.3px;
    }
    .menu-item {
      display: flex; align-items: center; gap: 14px; padding: 12px 14px;
      border-radius: 12px; color: #333; text-decoration: none; font-size: 15px;
      font-weight: 500; margin-bottom: 2px;
    }
    .menu-item:hover { background: #f5f5f5; }
    .menu-item.active { background: #f0f7eb; color: #3d6b1e; }
    .menu-item svg { width: 20px; height: 20px; flex-shrink: 0; }
    .soon-badge { margin-left: auto; background: #e8f5e9; color: #2e7d32; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 10px; }
    .signout-item { color: #d32f2f !important; }

    /* Content */
    .container { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
    .subtitle { color: #666; font-size: 15px; margin-bottom: 28px; }

    .section-title {
      font-size: 16px; font-weight: 600; margin-bottom: 14px;
    }

    /* Countries Grid */
    .countries-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 28px;
    }
    .country-card {
      background: white;
      border: 1.5px solid #e8e8e8;
      border-radius: 14px;
      padding: 14px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .country-card:hover { border-color: #3d6b1e; }
    .country-card.active {
      border-color: #3d6b1e;
      background: #f0f7eb;
    }
    .country-flag { font-size: 22px; }
    .country-name { font-size: 14px; font-weight: 500; }

    /* Apps */
    .apps-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 30px;
    }
    .app-card {
      background: white;
      border: 1.5px solid #e8e8e8;
      border-radius: 14px;
      padding: 16px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .app-card:hover { border-color: #3d6b1e; }
    .app-card.active {
      border-color: #3d6b1e;
      background: #f0f7eb;
    }
    .app-icon { font-size: 24px; margin-bottom: 6px; }
    .app-name { font-size: 13px; font-weight: 500; }

    .buy-btn {
      width: 100%;
      padding: 16px;
      background: #3d6b1e;
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .buy-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    /* ===== CHAT POPUP ===== */
    .chat-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000;
      display: flex; align-items: flex-end; justify-content: center;
      padding: 0; opacity: 0; visibility: hidden; transition: all 0.3s ease;
    }
    .chat-overlay.active { opacity: 1; visibility: visible; }

    .chat-box {
      background: white;
      width: 100%;
      max-width: 420px;
      height: 70vh;
      max-height: 520px;
      border-radius: 20px 20px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(100%);
      transition: transform 0.35s ease;
    }
    .chat-overlay.active .chat-box { transform: translateY(0); }

    .chat-header {
      padding: 16px 20px;
      background: #3d6b1e;
      color: white;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-header .avatar-small {
      width: 38px; height: 38px; background: white; color: #3d6b1e;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px;
    }
    .chat-header-info h3 { font-size: 16px; font-weight: 600; }
    .chat-header-info p { font-size: 12px; opacity: 0.85; }

    .chat-messages {
      flex: 1;
      padding: 20px 16px;
      overflow-y: auto;
      background: #f7f7f7;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      animation: fadeIn 0.3s ease;
    }
    .message.bot {
      background: white;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    .message.user {
      background: #3d6b1e;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .typing {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      background: white;
      border-radius: 18px;
      align-self: flex-start;
      width: fit-content;
    }
    .typing span {
      width: 7px; height: 7px; background: #999; border-radius: 50%;
      animation: typing 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- SIDEBAR OVERLAY -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="logo.png" alt="Trust Social">

    <div class="menu-section">

      <a href="logs.html" class="menu-item">

      <a href="tools.html" class="menu-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        Tools Store
      </a>
      <a href="sms.html" class="menu-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        SMS Numbers
      </a>
      <a href="#" class="menu-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        SME Boosting <span class="soon-badge">Soon</span>
      </a>
    </div>

    <div class="menu-section">
      <div class="menu-section-title">Account</div>
      <a href="#" class="menu-item">Support</a>
      <a href="#" class="menu-item">Notification</a>
      <a href="#" class="menu-item">Profile</a>
    </div>

    <div class="menu-section" style="border-top:1px solid #eee; margin-top:10px; padding-top:10px;">
      <a href="#" class="menu-item signout-item" id="signOutBtn">Sign out</a>
    </div>
  </div>

  <!-- HEADER -->
  <header class="header" id="header">
    <button class="menu-toggle" id="menuToggle">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
      </svg>
    </button>
    <div class="header-right">
      <span class="badge-no">No</span>
      <button class="icon-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
      </button>
      <button class="icon-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>

      </button>
      <div class="avatar" id="userAvatar">--</div>
    </div>
  </header>

  <div class="container">
    <h1>SMS Numbers</h1>
    <p class="subtitle">Get temporary numbers for verification</p>

    <div class="section-title">1. Choose Country</div>
    <div class="countries-grid" id="countriesGrid">
      <!-- Countries will be added by JavaScript -->
    </div>

    <div class="section-title">2. Choose App</div>
    <div class="apps-grid" id="appsGrid">
      <!-- Apps will be added by JavaScript -->
    </div>

    <button class="buy-btn" id="buyBtn" disabled>Select Country & App first</button>
  </div>

  <!-- CHAT POPUP -->
  <div class="chat-overlay" id="chatOverlay">
    <div class="chat-box">
      <div class="chat-header">
        <div class="avatar-small">TS</div>
        <div class="chat-header-info">
          <h3>Trust Socials</h3>
          <p>Online</p>
        </div>
      </div>
      <div class="chat-messages" id="chatMessages">
        <!-- Messages will appear here with animation -->
      </div>
    </div>
  </div>
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDDutrOemL5dqk4hIdQ1K2QmhiBhtegv8k",
      authDomain: "trustsocials-8fc8b.firebaseapp.com",
      projectId: "trustsocials-8fc8b",
      storageBucket: "trustsocials-8fc8b.firebasestorage.app",
      messagingSenderId: "675550258010",
      appId: "1:675550258010:web:ec6444eb22b04a92fd0963",
      measurementId: "G-KDVYRV55JD"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);

    // ========== DATA ==========
    const countries = [
      { name: "United States", flag: "🇺🇸" },
      { name: "United Kingdom", flag: "🇬🇧" },
      { name: "Canada", flag: "🇨🇦" },
      { name: "Germany", flag: "🇩🇪" },
      { name: "France", flag: "🇫🇷" },
      { name: "Netherlands", flag: "🇳🇱" },
      { name: "Australia", flag: "🇦🇺" },
      { name: "Sweden", flag: "🇸🇪" },
      { name: "Poland", flag: "🇵🇱" },
      { name: "Spain", flag: "🇪🇸" },
      { name: "Italy", flag: "🇮🇹" },
      { name: "Brazil", flag: "🇧🇷" },
      { name: "India", flag: "🇮🇳" },
      { name: "Indonesia", flag: "🇮🇩" },
      { name: "Philippines", flag: "🇵🇭" },
      { name: "Malaysia", flag: "🇲🇾" },
      { name: "Singapore", flag: "🇸🇬" },
      { name: "South Africa", flag: "🇿🇦" },
      { name: "Nigeria", flag: "🇳🇬" },
      { name: "Other Country", flag: "🌍" }
    ];

    const apps = [
      { name: "WhatsApp", icon: "💬" },
      { name: "Telegram", icon: "✈️" },
      { name: "Instagram", icon: "📸" },
      { name: "Gmail", icon: "📧" },
      { name: "Facebook", icon: "👤" },
      { name: "Twitter/X", icon: "🐦" },
      { name: "TikTok", icon: "🎵" },
      { name: "Discord", icon: "🎮" },
      { name: "Other App", icon: "📱" }
    ];

    let selectedCountry = null;
    let selectedApp = null;

    // ========== SIDEBAR ==========
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');

    document.getElementById('menuToggle').addEventListener('click', () => {
      sidebar.classList.add('active');
      overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    });
    overlay.addEventListener('click', () => {
      sidebar.classList.remove('active');
      overlay.classList.remove('active');
      document.body.style.overflow = '';
    });

    // Header scroll
    window.addEventListener('scroll', () => {
      document.getElementById('header').classList.toggle('scrolled', window.scrollY > 10);
    });

    // Sign out
    document.getElementById('signOutBtn').addEventListener('click', async (e) => {
      e.preventDefault();
      await signOut(auth);
      window.location.href = 'login.html';
    });

    // ========== RENDER COUNTRIES ==========
    const countriesGrid = document.getElementById('countriesGrid');
    countries.forEach(country => {
      const card = document.createElement('div');
      card.className = 'country-card';
      card.innerHTML = `
        <span class="country-flag">${country.flag}</span>
        <span class="country-name">${country.name}</span>
      `;
      card.addEventListener('click', () => {
        document.querySelectorAll('.country-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        selectedCountry = country.name;
        updateBuyButton();
      });
      countriesGrid.appendChild(card);
    });

    // ========== RENDER APPS ==========
    const appsGrid = document.getElementById('appsGrid');
    apps.forEach(appItem => {
      const card = document.createElement('div');
      card.className = 'app-card';
      card.innerHTML = `
        <div class="app-icon">${appItem.icon}</div>
        <div class="app-name">${appItem.name}</div>
      `;
      card.addEventListener('click', () => {
        document.querySelectorAll('.app-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        selectedApp = appItem.name;
        updateBuyButton();
      });
      appsGrid.appendChild(card);
    });

    // ========== BUY BUTTON ==========
    const buyBtn = document.getElementById('buyBtn');

    function updateBuyButton() {
      if (selectedCountry && selectedApp) {
        buyBtn.disabled = false;
        buyBtn.textContent = `Buy ${selectedApp} Number (${selectedCountry})`;
      } else {
        buyBtn.disabled = true;
        buyBtn.textContent = 'Select Country & App first';
      }
    }

    buyBtn.addEventListener('click', () => {
      if (!selectedCountry || !selectedApp) return;
      startChatAnimation();
    });

    // ========== CHAT ANIMATION ==========
    const chatOverlay = document.getElementById('chatOverlay');
    const chatMessages = document.getElementById('chatMessages');

    function startChatAnimation() {
      chatMessages.innerHTML = '';
      chatOverlay.classList.add('active');

      // Step 1: Typing
      setTimeout(() => showTyping(), 400);

      // Step 2: User message
      setTimeout(() => {
        removeTyping();
        addMessage(`Hey, I want to buy the SMS number for <b>${selectedCountry} - ${selectedApp}</b>`, 'user');
      }, 1600);

      // Step 3: Typing
      setTimeout(() => showTyping(), 2400);

      // Step 4: Bot reply 1
      setTimeout(() => {
        removeTyping();
        addMessage('Available, checking availability.', 'bot');
      }, 3600);

      // Step 5: Typing
      setTimeout(() => showTyping(), 4400);

      // Step 6: Bot reply 2 + redirect
      setTimeout(() => {
        removeTyping();
        addMessage('Hold on, redirecting to WhatsApp...', 'bot');

        // Redirect after short delay
        setTimeout(() => {
          const message = `Hi, I want to buy a temporary ${selectedApp} number for ${selectedCountry}.`;
          const url = `https://wa.me/2349117412352?text=${encodeURIComponent(message)}`;
          window.open(url, '_blank');

          // Close chat after redirect
          setTimeout(() => {
            chatOverlay.classList.remove('active');
          }, 1000);
        }, 1500);

      }, 5600);
    }

    function showTyping() {
      const typing = document.createElement('div');
      typing.className = 'typing';
      typing.id = 'typingIndicator';
      typing.innerHTML = '<span></span><span></span><span></span>';
      chatMessages.appendChild(typing);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function removeTyping() {
      const typing = document.getElementById('typingIndicator');
      if (typing) typing.remove();
    }

    function addMessage(text, type) {
      const msg = document.createElement('div');
      msg.className = `message ${type}`;
      msg.innerHTML = text;
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // ========== AUTH ==========
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      const displayName = user.displayName || user.email.split('@')[0];
      const names = displayName.trim().split(' ');
      let initials = names[0].charAt(0).toUpperCase();
      if (names.length > 1) initials += names[names.length - 1].charAt(0).toUpperCase();
      document.getElementById('userAvatar').textContent = initials;
    });
  </script>
</body>
</html>
