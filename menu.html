<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Menu - TemmySocials</title>

  <!-- GLOBAL THEME -->
  <link rel="stylesheet" href="theme.css">

  <!-- MENU DESIGN -->
  <link rel="stylesheet" href="menu.css">

</head>

<body>

  <!-- MOBILE MENU -->
  <div class="mobile-menu">

    <!-- MENU HEADER -->
    <header class="mobile-menu-header">

      <!-- LOGO -->
      <a href="index.html" class="mobile-menu-logo">
        <img
          src="logo.png.jpg"
          alt="Temmy Social"
        >
      </a>


      <!-- HEADER ACTIONS -->
      <div class="mobile-menu-actions">

        <!-- THEME -->
        <button
          type="button"
          class="mobile-theme-button theme-button"
          aria-label="Toggle theme"
        >

          <svg
            viewBox="0 0 32 32"
            aria-hidden="true"
          >

            <circle
              cx="16"
              cy="16"
              r="5.2"
            ></circle>

            <line
              x1="16"
              y1="2.8"
              x2="16"
              y2="7"
            ></line>

            <line
              x1="16"
              y1="25"
              x2="16"
              y2="29.2"
            ></line>

            <line
              x1="2.8"
              y1="16"
              x2="7"
              y2="16"
            ></line>

            <line
              x1="25"
              y1="16"
              x2="29.2"
              y2="16"
            ></line>

            <line
              x1="6.6"
              y1="6.6"
              x2="9.6"
              y2="9.6"
            ></line>

            <line
              x1="22.4"
              y1="22.4"
              x2="25.4"
              y2="25.4"
            ></line>

            <line
              x1="22.4"
              y1="9.6"
              x2="25.4"
              y2="6.6"
            ></line>

            <line
              x1="6.6"
              y1="25.4"
              x2="9.6"
              y2="22.4"
            ></line>

          </svg>

        </button>


        <!-- CLOSE -->
        <a
          href="index.html"
          class="mobile-close-button"
          aria-label="Close menu"
        >

          <svg
            viewBox="0 0 32 32"
            aria-hidden="true"
          >

            <line
              x1="6"
              y1="6"
              x2="26"
              y2="26"
            ></line>

            <line
              x1="26"
              y1="6"
              x2="6"
              y2="26"
            ></line>

          </svg>

        </a>

      </div>

    </header>


    <!-- MENU CONTENT -->
    <main class="mobile-menu-content">


      <!-- NAVIGATION -->
      <nav class="mobile-menu-links">

        <a href="services.html">
          Services
        </a>

        <a href="about.html">
          About
        </a>

        <a href="pricing.html">
          Pricing
        </a>

        <a href="faq.html">
          FAQ
        </a>

        <a href="index.html">
          Home
        </a>

      </nav>


      <!-- ACCOUNT -->
      <div class="mobile-menu-account">

        <a
          href="login.html"
          class="menu-signin"
        >
          Sign in
        </a>

        <a
          href="signup.html"
          class="menu-register"
        >
          Get started free
        </a>

      </div>

    </main>

  </div>


  <!-- GLOBAL THEME -->
  <script src="theme.js"></script>

</body>

</html>
