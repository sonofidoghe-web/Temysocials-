<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temmy Social - Menu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #111;
      min-height: 100vh;
    }

    .menu {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 20px 40px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid #e5e5e5;
    }

    .logo {
      height: 42px;
      width: auto;
      display: block;
    }

    .header-icons {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }

    .icon-btn svg {
      width: 22px;
      height: 22px;
    }

    /* Navigation links */
    nav {
      flex: 1;
      padding: 32px 8px 24px;
      display: flex;
      flex-direction: column;
      gap: 36px;
    }

    nav a {
      text-decoration: none;
      color: #111;
      font-size: 26px;
      font-weight: 500;
      letter-spacing: -0.3px;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #3d6b1e;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: #e5e5e5;
      margin: 8px 0 28px;
    }

    /* Buttons */
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 0 4px;
    }

    .btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 16px 24px;
      font-size: 17px;
      font-weight: 500;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-outline {
      background: #fff;
      color: #111;
      border: 1.5px solid #e0e0e0;
    }

    .btn-outline:hover {
      background: #f8f8f8;
      border-color: #ccc;
    }

    .btn-solid {
      background: #3d6b1e;       /* matches the green in your design */
      color: #fff;
      border: none;
    }

    .btn-solid:hover {
      background: #345c19;
    }
  </style>
</head>
<body>
  <div class="menu">
    <!-- Header -->
    <div class="header">
      <!-- Replace logo.png with your actual logo file -->
      <img src="logo.png.jpg" alt="Temmy Social" class="logo">

      <div class="header-icons">
        <!-- Theme toggle (sun) -->
        <button class="icon-btn" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
        </button>

        <!-- Close (X) -->
        <button class="icon-btn" aria-label="Close menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Menu links -->
    <nav>
      <a href="services.html">Services</a>
      <a href="about.html">About</a>
      <a href="pricing.html">Pricing</a>
      <a href="faq.html">FAQ</a>
    </nav>

    <div class="divider"></div>

    <!-- Action buttons -->
    <div class="buttons">
      <a href="#signin" class="btn btn-outline">Sign in</a>
      <a href="#get-started" class="btn btn-solid">Get started free</a>
    </div>
  </div>
</body>
</html>
