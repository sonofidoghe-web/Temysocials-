<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transactions - Temmy Social</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8f9fa;
      color: #111;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* Header */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: #fff; padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #eee; transition: all 0.3s ease;
    }
    .header.scrolled {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .menu-toggle { background: none; border: none; cursor: pointer; padding: 4px; color: #333; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .badge-no { background: #f0f0f0; color: #555; font-size: 13px; font-weight: 500; padding: 4px 10px; border-radius: 20px; }
    .icon-btn { background: none; border: none; cursor: pointer; padding: 4px; color: #444; }
    .avatar {
      width: 36px; height: 36px; background: #3d6b1e; color: white;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 14px;
    }

    /* Sidebar */
    .sidebar-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200;
      opacity: 0; visibility: hidden; transition: all 0.3s ease;
    }
    .sidebar-overlay.active { opacity: 1; visibility: visible; }
    .sidebar {
      position: fixed; top: 0; left: 0; width: 300px; height: 100%;
      background: white; z-index: 300; transform: translateX(-100%);
      transition: transform 0.3s ease; overflow-y: auto; padding: 20px 0 30px;
    }
    .sidebar.active { transform: translateX(0); }
    .sidebar-logo { padding: 0 20px 20px; border-bottom: 1px solid #eee; }
    .sidebar-logo img { height: 40px; }
    .menu-section { padding: 20px 12px 8px; }
    .menu-section-title {
      font-size: 13px; color: #888; font-weight: 500; padding: 0 12px 10px;
      text-transform: uppercase; letter-spacing: 0.3px;
    }
    .menu-item {
      display: flex; align-items: center; gap: 14px; padding: 12px 14px;
      border-radius: 12px; color: #333; text-decoration: none; font-size: 15px;
      font-weight: 500; margin-bottom: 2px;
    }
    .menu-item:hover { background: #f5f5f5; }
    .menu-item.active { background: #f0f7eb; color: #3d6b1e; }
    .menu-item svg { width: 20px; height: 20px; flex-shrink: 0; }
    .soon-badge { margin-left: auto; background: #e8f5e9; color: #2e7d32; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 10px; }
    .signout-item { color: #d32f2f !important; margin-top: 10px; }
    .signout-item:hover { background: #ffebee !important; }

    /* Content */
    .container { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { color: #666; font-size: 15px; margin-bottom: 20px; }

    .search-box {
      position: relative;
      margin-bottom: 20px;
    }
    .search-box input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      border: 1.5px solid #e0e0e0;
      border-radius: 14px;
      font-size: 15px;
      outline: none;
      background: white;
    }
    .search-box input:focus { border-color: #3d6b1e; }
    .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #999;
    }

    .tx-list {
      background: white;
      border-radius: 16px;
      border: 1px solid #f0f0f0;
      overflow: hidden;
    }

    .tx-item {
      display: flex;
      gap: 14px;
      padding: 16px;
      border-bottom: 1px solid #f5f5f5;
    }
    .tx-item:last-child { border-bottom: none; }

    .tx-icon {
      width: 42px;
      height: 42px;
      background: #e8f5e9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .tx-body { flex: 1; min-width: 0; }
    .tx-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 2px;
    }
    .tx-title { font-size: 15px; font-weight: 600; }
    .tx-status {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .status-failed { background: #fce8e6; color: #c5221f; }
    .status-pending { background: #fff3e0; color: #ef6c00; }
    .status-success { background: #e6f4ea; color: #137333; }

    .tx-desc { font-size: 13px; color: #555; margin-bottom: 4px; }
    .tx-meta {
      font-size: 12px;
      color: #999;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tx-meta .copy-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #999;
      padding: 0;
      display: inline-flex;
    }

    .tx-amount {
      font-size: 15px;
      font-weight: 600;
      color: #3d6b1e;
      white-space: nowrap;
    }
    .tx-amount.negative { color: #c5221f; }

    .empty-state {
      padding: 50px 20px;
      text-align: center;
      color: #888;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <!-- SIDEBAR OVERLAY -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="logo.png" alt="Temmy Social">
    </div>

    <div class="menu-section">
      <div class="menu-section-title">Main</div>
      <a href="dashboard.html" class="menu-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </a>
      <a href="wallet.html" class="menu-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M22 10H2"/><path d="M6 14h.01"/></svg>
        Wallet
      </a>
      <a href="orders.html" class="menu-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        Orders
      </a>
      <a href="transactions.html" class="menu-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        Transactions
      </a>
    </div>

    <div class="menu-section">
      <div class="menu-section-title">Store</div>
      <a href="#" class="menu-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        Logs Store
      </a>
      <a href="#" class="menu-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        Tools Store
      </a>
      <a href="#" class="menu-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        SMS Numbers <span class="soon-badge">Soon</span>
      </a>
      <a href="#" class="menu-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        SME Boosting <span class="soon-badge">Soon</span>
      </a>
    </div>

    <div class="menu-section">
      <div class="menu-section-title">Account</div>
      <a href="#" class="menu-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
        Support
      </a>
      <a href="#" class="menu-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        Notification
      </a>
      <a href="#" class="menu-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 0v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profile
      </a>
    </div>

    <div class="menu-section" style="border-top:1px solid #eee; margin-top:10px; padding-top:10px;">
      <a href="#" class="menu-item signout-item" id="signOutBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </a>
    </div>
  </div>

  <!-- HEADER -->
  <header class="header" id="header">
    <button class="menu-toggle" id="menuToggle">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
      </svg>
    </button>
    <div class="header-right">
      <span class="badge-no">No</span>
      <button class="icon-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
      </button>
      <button class="icon-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
      </button>
      <div class="avatar" id="userAvatar">--</div>
    </div>
  </header>

  <div class="container">
    <h1>Transactions</h1>
    <p class="subtitle">Your complete transaction history</p>

    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Search by reference, type, or ID...">
    </div>

    <div class="tx-list" id="txList">
      <div class="empty-state">Loading transactions...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { 
      getFirestore, collection, query, where, orderBy, getDocs, updateDoc, doc 
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDDutrOemL5dqk4hIdQ1K2QmhiBhtegv8k",
      authDomain: "trustsocials-8fc8b.firebaseapp.com",
      projectId: "trustsocials-8fc8b",
      storageBucket: "trustsocials-8fc8b.firebasestorage.app",
      messagingSenderId: "675550258010",
      appId: "1:675550258010:web:ec6444eb22b04a92fd0963",
      measurementId: "G-KDVYRV55JD"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Sidebar
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    document.getElementById('menuToggle').addEventListener('click', () => {
      sidebar.classList.add('active');
      overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    });
    overlay.addEventListener('click', () => {
      sidebar.classList.remove('active');
      overlay.classList.remove('active');
      document.body.style.overflow = '';
    });

    // Header scroll
    window.addEventListener('scroll', () => {
      document.getElementById('header').classList.toggle('scrolled', window.scrollY > 10);
    });

    // Sign out
    document.getElementById('signOutBtn').addEventListener('click', async (e) => {
      e.preventDefault();
      await signOut(auth);
      window.location.href = 'login.html';
    });

    let allTransactions = [];

    // Search
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase().trim();
      if (!term) {
        renderTransactions(allTransactions);
        return;
      }
      const filtered = allTransactions.filter(tx => 
        (tx.reference || '').toLowerCase().includes(term) ||
        (tx.type || '').toLowerCase().includes(term) ||
        (tx.method || '').toLowerCase().includes(term) ||
        (tx.id || '').toLowerCase().includes(term)
      );
      renderTransactions(filtered);
    });

    function renderTransactions(list) {
      const container = document.getElementById('txList');

      if (list.length === 0) {
        container.innerHTML = `<div class="empty-state">No transactions found</div>`;
        return;
      }

      let html = '';
      list.forEach(tx => {
        const isCredit = tx.type === 'topup' || (tx.amount && tx.amount > 0);
        const amountClass = isCredit ? '' : 'negative';
        const amountPrefix = isCredit ? '+' : '-';

        const methodName = tx.method === 'bank' ? 'Bank transfer' : 
                           tx.method === 'card' ? 'Card' : 
                           (tx.method || 'Unknown');

        const desc = tx.type === 'topup' 
          ? `Wallet top up via ${methodName}`
          : (tx.description || 'Purchase');

        const dateStr = tx.createdAt?.toDate 
          ? tx.createdAt.toDate().toLocaleString('en-GB', {
              day: 'numeric', month: 'short', year: 'numeric',
              hour: '2-digit', minute: '2-digit'
            })
          : '';

        html += `
          <div class="tx-item">
            <div class="tx-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3d6b1e" stroke-width="2">
                <polyline points="17 1 21 5 17 9"/>
                <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
              </svg>
            </div>
            <div class="tx-body">
              <div class="tx-top">
                <span class="tx-title">${tx.type === 'topup' ? 'Top up' : 'Purchase'}</span>
                <span class="tx-status status-${tx.status}">${tx.status}</span>
              </div>
              <div class="tx-desc">${desc}</div>
              <div class="tx-meta">
                ${dateStr}
                <span>·</span>
                <span>${tx.reference || tx.id || ''}</span>
                <button class="copy-btn" onclick="copyText('${tx.reference || ''}')">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2"/>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                  </svg>
                </button>
              </div>
            </div>
            <div class="tx-amount ${amountClass}">
              ${amountPrefix}₦${Math.abs(tx.amount || 0).toLocaleString()}
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    window.copyText = function(text) {
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => alert('Copied!'));
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      // Avatar
      const displayName = user.displayName || user.email.split('@')[0];
      const names = displayName.trim().split(' ');
      let initials = names[0].charAt(0).toUpperCase();
      if (names.length > 1) initials += names[names.length-1].charAt(0).toUpperCase();
      document.getElementById('userAvatar').textContent = initials;

      // Load all transactions
      try {
        const q = query(
          collection(db, 'transactions'),
          where('userId', '==', user.uid),
          orderBy('createdAt', 'desc')
        );
        const snapshot = await getDocs(q);

        allTransactions = [];
        const now = Date.now();

        for (const docSnap of snapshot.docs) {
          const data = docSnap.data();
          let status = data.status || 'pending';

          // Auto-fail pending after 1 minute
          if (status === 'pending' && data.createdAt) {
            const created = data.createdAt.toDate ? data.createdAt.toDate().getTime() : data.createdAt;
            if (now - created > 60000) {
              status = 'failed';
              await updateDoc(doc(db, 'transactions', docSnap.id), { status: 'failed' });
            }
          }

          allTransactions.push({
            id: docSnap.id,
            ...data,
            status
          });
        }

        renderTransactions(allTransactions);

      } catch (err) {
        console.error(err);
        document.getElementById('txList').innerHTML = `<div class="empty-state">Unable to load transactions</div>`;
      }
    });
  </script>
</body>
</html>
